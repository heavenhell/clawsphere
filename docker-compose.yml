services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clawsphere
      POSTGRES_USER: clawsphere
      POSTGRES_PASSWORD: clawsphere-local
    ports:
      - "54329:5432"
    volumes:
      - clawsphere_pgdata:/var/lib/postgresql/data
      - ./backend/memory/postgres_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawsphere -d clawsphere"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clawsphere_pgdata:
